name: Update ICS feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate feed.ics
        run: node scripts/generate-ics.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- feed.ics; then
            echo "No changes to feed.ics"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.ics
          git commit -m "Update feed.ics"
          git push
